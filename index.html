<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:GO Bunnyhopping Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            z-index: 100;
            text-shadow: 0 0 10px #00ff00;
        }
        
        #speed {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff00;
        }
        
        .control-line {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="speed">Speed: 0 u/s</div>
        <div id="height">Height: 0</div>
    </div>
    
    <div id="controls">
        <div class="control-line">W/A/S/D - Move</div>
        <div class="control-line">SPACE - Jump (Bhop)</div>
        <div class="control-line">MOUSE - Look Around</div>
        <div class="control-line">Mouse Click - Switch Knife Skin</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // PLAYER CLASS
        class Player {
            constructor(camera) {
                this.camera = camera;
                this.position = new THREE.Vector3(0, 100, 0);
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.acceleration = new THREE.Vector3(0, 0, 0);
                
                this.yaw = 0;
                this.pitch = 0;
                
                this.speed = 2;
                this.jumpForce = 15;
                this.gravity = 0.8;
                this.friction = 0.98;
                this.airAcceleration = 0.15;
                this.groundAcceleration = 0.3;
                
                this.isGrounded = false;
                this.jumpCount = 0;
                this.lastJumpTime = 0;
                this.jumpCooldown = 50;
                
                this.mouseSensitivity = 0.003;
                this.size = new THREE.Vector3(16, 36, 16);
            }

            update(keys) {
                // Apply gravity
                this.velocity.y -= this.gravity;

                // Movement input
                const moveDir = new THREE.Vector3();
                const forward = new THREE.Vector3(
                    Math.sin(this.yaw),
                    0,
                    Math.cos(this.yaw)
                );
                const right = new THREE.Vector3(
                    Math.sin(this.yaw + Math.PI / 2),
                    0,
                    Math.cos(this.yaw + Math.PI / 2)
                );

                if (keys['w'] || keys['W']) moveDir.add(forward);
                if (keys['s'] || keys['S']) moveDir.sub(forward);
                if (keys['a'] || keys['A']) moveDir.sub(right);
                if (keys['d'] || keys['D']) moveDir.add(right);

                if (moveDir.length() > 0) {
                    moveDir.normalize();
                }

                // Acceleration
                const accel = this.isGrounded ? this.groundAcceleration : this.airAcceleration;
                this.velocity.x += moveDir.x * accel * this.speed;
                this.velocity.z += moveDir.z * accel * this.speed;

                // Friction
                this.velocity.x *= this.friction;
                this.velocity.z *= this.friction;

                // Jumping (Bunnyhopping)
                if ((keys[' '] || keys['Spacebar']) && this.isGrounded) {
                    const now = Date.now();
                    if (now - this.lastJumpTime > this.jumpCooldown) {
                        this.velocity.y = this.jumpForce;
                        this.isGrounded = false;
                        this.lastJumpTime = now;
                    }
                }

                // Update position
                this.position.add(this.velocity);
                this.camera.position.copy(this.position);
                this.camera.position.y += 8; // Eye height

                // Collision with ground
                if (this.position.y <= 0) {
                    this.position.y = 0;
                    this.velocity.y = 0;
                    this.isGrounded = true;
                } else {
                    this.isGrounded = false;
                }
            }

            handleMouseMove(event) {
                this.yaw -= event.movementX * this.mouseSensitivity;
                this.pitch -= event.movementY * this.mouseSensitivity;
                
                // Clamp pitch
                this.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, this.pitch));
                
                // Update camera rotation
                this.camera.rotation.order = 'YXZ';
                this.camera.rotation.y = this.yaw;
                this.camera.rotation.x = this.pitch;
            }
        }

        // MAP CLASS
        class Map {
            constructor(scene) {
                this.scene = scene;
                this.createGround();
                this.createRamps();
                this.createPlatforms();
                this.createWalls();
            }

            createGround() {
                const groundGeometry = new THREE.PlaneGeometry(500, 500);
                const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x808080 });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.position.y = 0;
                ground.receiveShadow = true;
                this.scene.add(ground);
            }

            createRamps() {
                // Ramp 1 - 45 degrees
                const ramp1Geo = new THREE.PlaneGeometry(100, 150);
                const rampMat = new THREE.MeshLambertMaterial({ color: 0xa0522d });
                const ramp1 = new THREE.Mesh(ramp1Geo, rampMat);
                ramp1.rotation.x = -Math.PI / 4;
                ramp1.position.set(-100, 50, 100);
                ramp1.castShadow = true;
                ramp1.receiveShadow = true;
                this.scene.add(ramp1);

                // Ramp 2 - downhill
                const ramp2 = new THREE.Mesh(ramp1Geo, rampMat);
                ramp2.rotation.x = Math.PI / 5;
                ramp2.position.set(100, 30, 150);
                ramp2.castShadow = true;
                ramp2.receiveShadow = true;
                this.scene.add(ramp2);
            }

            createPlatforms() {
                const platforms = [
                    { x: 0, y: 80, z: -200, w: 60, h: 20 },
                    { x: 150, y: 100, z: -250, w: 50, h: 15 },
                    { x: -150, y: 120, z: -300, w: 40, h: 15 },
                    { x: 0, y: 140, z: -400, w: 50, h: 15 }
                ];

                const platformMat = new THREE.MeshLambertMaterial({ color: 0x4169e1 });

                platforms.forEach(p => {
                    const geo = new THREE.BoxGeometry(p.w, p.h, p.w);
                    const platform = new THREE.Mesh(geo, platformMat);
                    platform.position.set(p.x, p.y, p.z);
                    platform.castShadow = true;
                    platform.receiveShadow = true;
                    this.scene.add(platform);
                });
            }

            createWalls() {
                const wallMat = new THREE.MeshLambertMaterial({ color: 0x696969 });
                const wallGeo = new THREE.BoxGeometry(20, 200, 500);

                const leftWall = new THREE.Mesh(wallGeo, wallMat);
                leftWall.position.set(-250, 100, 0);
                leftWall.castShadow = true;
                this.scene.add(leftWall);

                const rightWall = new THREE.Mesh(wallGeo, wallMat);
                rightWall.position.set(250, 100, 0);
                rightWall.castShadow = true;
                this.scene.add(rightWall);
            }
        }

        // KNIFE CLASS
        class Knife {
            constructor(scene) {
                this.scene = scene;
                this.group = new THREE.Group();
                this.scene.add(this.group);
                
                this.currentSkin = 'Marble Fade';
                this.createKnife();
                this.createHand();
                
                this.rotation = 0;
            }

            createKnife() {
                // Butterfly knife blade
                const bladeGeometry = new THREE.BoxGeometry(2, 8, 0.3);
                const bladeMaterial = this.getSkinMaterial(this.currentSkin);
                this.blade = new THREE.Mesh(bladeGeometry, bladeMaterial);
                this.blade.castShadow = true;
                this.group.add(this.blade);

                // Handle
                const handleGeometry = new THREE.BoxGeometry(2, 5, 0.5);
                const handleMaterial = new THREE.MeshStandardMaterial({ color: 0x2c2c2c });
                this.handle = new THREE.Mesh(handleGeometry, handleMaterial);
                this.handle.position.y = -6;
                this.handle.castShadow = true;
                this.group.add(this.handle);
            }

            createHand() {
                // Green gloves from CS:GO
                const gloveGeometry = new THREE.BoxGeometry(3, 4, 3);
                const gloveMaterial = new THREE.MeshStandardMaterial({ color: 0x00aa00 });
                this.glove = new THREE.Mesh(gloveGeometry, gloveMaterial);
                this.glove.position.set(3, -8, -1);
                this.glove.castShadow = true;
                this.group.add(this.glove);

                // Sleeve
                const sleeveGeometry = new THREE.BoxGeometry(4, 8, 3.5);
                const sleeveMaterial = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
                this.sleeve = new THREE.Mesh(sleeveGeometry, sleeveMaterial);
                this.sleeve.position.set(4, -15, -1);
                this.sleeve.castShadow = true;
                this.group.add(this.sleeve);
            }

            getSkinMaterial(skinName) {
                const skins = {
                    'Marble Fade': new THREE.MeshStandardMaterial({
                        color: 0xff00ff,
                        metalness: 0.8,
                        roughness: 0.2
                    }),
                    'Fade': new THREE.MeshStandardMaterial({
                        color: 0xffaa00,
                        metalness: 0.9,
                        roughness: 0.1
                    }),
                    'Crimson Web': new THREE.MeshStandardMaterial({
                        color: 0xcc0000,
                        metalness: 0.7,
                        roughness: 0.3
                    }),
                    'Night': new THREE.MeshStandardMaterial({
                        color: 0x222222,
                        metalness: 0.8,
                        roughness: 0.4
                    }),
                    'Forest DDPAT': new THREE.MeshStandardMaterial({
                        color: 0x228b22,
                        metalness: 0.6,
                        roughness: 0.5
                    }),
                    'Boreal Forest': new THREE.MeshStandardMaterial({
                        color: 0x1a4d2e,
                        metalness: 0.7,
                        roughness: 0.4
                    })
                };
                return skins[skinName] || skins['Marble Fade'];
            }

            changeSkin(skinName) {
                this.currentSkin = skinName;
                this.blade.material = this.getSkinMaterial(skinName);
            }

            update(player) {
                // Position knife in front of camera
                this.group.position.copy(player.camera.position);
                const cameraDir = new THREE.Vector3(
                    Math.sin(player.yaw),
                    Math.sin(player.pitch),
                    Math.cos(player.yaw)
                );
                this.group.position.addScaledVector(cameraDir, 5);
                this.group.position.y -= 3;

                // Rotation and animation
                this.rotation += 0.02;
                this.group.rotation.z = this.rotation * 0.3;
                this.group.rotation.x = player.pitch * 0.3;
                this.group.rotation.y = player.yaw;

                // Bob animation
                this.group.position.y += Math.sin(this.rotation) * 0.3;
            }
        }

        // GAME LOGIC
        let scene, camera, renderer;
        let player;
        let map;
        let knife;
        let keys = {};
        let knifeIndex = 0;

        const knifeSkins = [
            'Marble Fade',
            'Fade',
            'Crimson Web',
            'Night',
            'Forest DDPAT',
            'Boreal Forest'
        ];

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 1000, 3000);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(0, 100, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFShadowShadowMap;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(500, 500, 500);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Initialize game objects
            player = new Player(camera);
            map = new Map(scene);
            knife = new Knife(scene);

            // Input handling
            document.addEventListener('keydown', (e) => keys[e.key] = true);
            document.addEventListener('keyup', (e) => keys[e.key] = false);
            document.addEventListener('mousemove', (e) => player.handleMouseMove(e));
            document.addEventListener('click', switchKnife);

            // Pointer lock
            document.addEventListener('click', () => {
                renderer.domElement.requestPointerLock();
            });

            // Window resize
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function switchKnife() {
            knifeIndex = (knifeIndex + 1) % knifeSkins.length;
            knife.changeSkin(knifeSkins[knifeIndex]);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Update player
            player.update(keys);
            knife.update(player);

            // Update UI
            document.getElementById('speed').textContent = `Speed: ${Math.round(player.velocity.length())} u/s`;
            document.getElementById('height').textContent = `Height: ${Math.round(player.position.y)}`;

            renderer.render(scene, camera);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
